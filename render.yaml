services:
  - type: web
    name: claim-copilot
    runtime: python
    plan: free
    buildCommand: "echo no dependencies"
    startCommand: python3 -m app.server
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
